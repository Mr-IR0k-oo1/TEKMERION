[workspace]
members = [
    "apps/tui",
    "crates/core",
    "crates/face",
    "crates/discovery",
    "crates/verification",
    "crates/evidence",
    "crates/blockchain",
    "crates/audit",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
ratatui = "0.30"
crossterm = "0.29"

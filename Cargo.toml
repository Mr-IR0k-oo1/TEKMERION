[workspace]
members = [
    "apps/tui",
    "crates/core",
    "crates/face",
    "crates/discovery",
    "crates/verification",
    "crates/evidence",
    "crates/blockchain",
    "crates/audit",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
ratatui = "0.30"
crossterm = "0.28"

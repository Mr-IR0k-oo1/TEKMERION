services:
  # ============================================================================
  # TEKMERION Local Blockchain (Anvil)
  # ============================================================================
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: tekmerion-anvil
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    restart: unless-stopped

  # ============================================================================
  # TEKMERION Backend API, Python Face Worker, and Evidence Pipeline Engine
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tekmerion-backend:latest
    container_name: tekmerion-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - FACE_WORKER_PATH=/app/workers/face/worker.py
    depends_on:
      - anvil
    volumes:
      - tekmerion_runs:/app/runs
      - ./assets:/app/assets:ro
      - ./TEKMERION_TEST_DATA:/app/TEKMERION_TEST_DATA:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # TEKMERION Web Forensic Inspection UI (Nginx SPA + Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: tekmerion-frontend:latest
    container_name: tekmerion-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  # ============================================================================
  # TEKMERION Interactive Terminal User Interface (TUI) & CLI Tooling
  # Usage: docker compose run --rm tui [run|verify|tamper-test|inspect|contract-info]
  # ============================================================================
  tui:
    build:
      context: .
      dockerfile: Dockerfile
      target: tui
    image: tekmerion-tui:latest
    container_name: tekmerion-tui
    profiles:
      - cli
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - FACE_WORKER_PATH=/app/workers/face/worker.py
    volumes:
      - tekmerion_runs:/app/runs
      - ./assets:/app/assets:ro
      - ./TEKMERION_TEST_DATA:/app/TEKMERION_TEST_DATA:ro
    entrypoint: ["/usr/local/bin/tekmerion"]

volumes:
  tekmerion_runs:
    driver: local
